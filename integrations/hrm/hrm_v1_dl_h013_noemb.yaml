name: hrm.hrm_act_v1_dl@HierarchicalReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16
H_cycles: 2
L_cycles: 2
H_layers: 4
L_layers: 4
hidden_size: 512
num_heads: 8
expansion: 4
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope

# Phase 5 fine sweep: H-only DN p=0.13, NO embed RMSNorm.
# Theory predicted sweet spot under "M=8 gradient-visible depth" interpretation:
#   alpha=(2*8)^0.13 ≈ 1.45 (matches empirical h010n's α=1.46 closely).
# Or under "M=24 forward depth" interpretation: alpha=(48)^0.13 ≈ 1.660.
use_loop_deepnorm: True
loop_deepnorm_apply_to: h
loop_deepnorm_p: 0.13
input_embed_rmsnorm_placement: none
