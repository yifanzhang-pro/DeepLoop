name: hrm.hrm_act_v1_dl@HierarchicalReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy

halt_exploration_prob: 0.1
halt_max_steps: 16
H_cycles: 2
L_cycles: 2
H_layers: 4
L_layers: 4
hidden_size: 512
num_heads: 8
expansion: 4
puzzle_emb_ndim: ${.hidden_size}
pos_encodings: rope

# Phase 5: H-only DN p=0.05 (milder than h010n's p=0.1).
# M=24 → alpha=(48)^0.05 ≈ 1.21, beta=(192)^-0.05 ≈ 0.766.
# Tests if even less aggressive scaling preserves more puzzle-instance signal.
use_loop_deepnorm: True
loop_deepnorm_apply_to: h
loop_deepnorm_p: 0.05
input_embed_rmsnorm_placement: none
